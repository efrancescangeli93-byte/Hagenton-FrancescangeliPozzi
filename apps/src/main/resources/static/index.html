<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hackathon AI</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            margin: 0; background: #0f1117; color: #e6e6e6;
            display: flex; flex-direction: column; height: 100vh;
        }
        header {
            padding: 16px 20px; background: #161a23; border-bottom: 1px solid #262b36;
            font-size: 18px; font-weight: 600;
        }
        header span { color: #8b93a7; font-weight: 400; font-size: 13px; margin-left: 8px; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 75%; padding: 12px 16px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; }
        .user { align-self: flex-end; background: #2f6feb; color: #fff; border-bottom-right-radius: 4px; }
        .assistant { align-self: flex-start; background: #1e2430; border: 1px solid #2b3140; border-bottom-left-radius: 4px; }
        .thinking { align-self: flex-start; color: #8b93a7; font-style: italic; }
        footer { padding: 16px 20px; background: #161a23; border-top: 1px solid #262b36; display: flex; gap: 10px; }
        #input {
            flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid #2b3140;
            background: #0f1117; color: #e6e6e6; font-size: 15px; resize: none;
        }
        #send {
            padding: 0 22px; border: none; border-radius: 10px; background: #2f6feb;
            color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
        }
        #send:disabled { opacity: 0.5; cursor: default; }
    </style>
</head>
<body>
    <header>🚀 Hackathon AI <span>Spring Boot + Claude</span></header>
    <div id="chat"></div>
    <footer>
        <textarea id="input" rows="1" placeholder="Scrivi un messaggio..."></textarea>
        <button id="send">Invia</button>
    </footer>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const send = document.getElementById('send');
        let sessionId = null;

        function addMsg(text, cls) {
            const div = document.createElement('div');
            div.className = 'msg ' + cls;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        async function sendMessage() {
            const message = input.value.trim();
            if (!message) return;
            input.value = '';
            addMsg(message, 'user');
            send.disabled = true;
            const pending = addMsg('Claude sta pensando...', 'thinking');

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, sessionId })
                });
                const data = await res.json();
                pending.remove();
                if (res.ok) {
                    sessionId = data.sessionId || sessionId;
                    addMsg(data.reply || '(nessuna risposta)', 'assistant');
                } else {
                    addMsg('Errore: ' + (data.message || res.status), 'assistant');
                }
            } catch (e) {
                pending.remove();
                addMsg('Errore di rete: ' + e.message, 'assistant');
            } finally {
                send.disabled = false;
                input.focus();
            }
        }

        send.addEventListener('click', sendMessage);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
    </script>
</body>
</html>
