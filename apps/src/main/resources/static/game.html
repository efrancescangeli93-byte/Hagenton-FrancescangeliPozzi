<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fine Mese · motore</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, Segoe UI, Roboto, sans-serif; margin: 0; background: #0f1117; color: #e6e6e6; padding: 24px; }
  h1 { margin: 0 0 4px; } h1 .gt { color: #A100FF; }
  .sub { color: #8b93a7; margin-bottom: 16px; }
  .controls { background: #161a23; border: 1px solid #262b36; border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
  .controls .row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .controls label { color: #8b93a7; font-size: 14px; }
  input[type=range] { width: 260px; accent-color: #A100FF; }
  .val { font-weight: 700; font-size: 18px; min-width: 70px; }
  .choice button { padding: 8px 14px; border-radius: 8px; border: 1px solid #2b3140; background: #0f1117; color: #e6e6e6; cursor: pointer; font-size: 14px; }
  .choice button.active { background: #A100FF; border-color: #A100FF; color: #fff; font-weight: 600; }
  .banner { padding: 12px 16px; border-radius: 10px; margin: 12px 0; font-weight: 600; }
  .rosso { background: rgba(255,64,64,.15); border: 1px solid #ff4040; color: #ff8a8a; }
  .ok { background: rgba(64,200,120,.12); border: 1px solid #40c878; color: #7fe0a6; }
  .salva { background: rgba(161,0,255,.15); border: 1px solid #A100FF; color: #d19bff; }
  .kpis { display: flex; gap: 14px; flex-wrap: wrap; margin: 12px 0 18px; }
  .kpi { background: #161a23; border: 1px solid #262b36; border-radius: 12px; padding: 12px 16px; min-width: 130px; }
  .kpi .v { font-size: 22px; font-weight: 700; } .kpi .l { color: #8b93a7; font-size: 12px; }
  svg { background: #161a23; border: 1px solid #262b36; border-radius: 12px; width: 100%; height: 300px; }
  table { width: 100%; border-collapse: collapse; margin-top: 18px; font-size: 14px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #262b36; }
  th { color: #8b93a7; font-weight: 600; }
  td.neg { color: #ff8a8a; } td.pos { color: #7fe0a6; }
  tr.rossoRow td:last-child { color: #ff8a8a; font-weight: 700; }
</style>
</head>
<body>
  <h1>Fine Mese <span class="gt">&gt;</span> <span style="font-size:16px;color:#8b93a7">motore + scelte</span></h1>
  <div class="sub" id="apertura"></div>

  <div class="controls">
    <div class="row">
      <label>Cuscinetto messo da parte:</label>
      <input type="range" id="cusc" min="0" max="500" step="50" value="0">
      <span class="val" id="cuscVal">€0</span>
    </div>
    <div class="row" style="margin-top:12px;">
      <label>Quando arriva l'imprevisto:</label>
      <span class="choice">
        <button data-s="PAGA_DAL_CONTO" class="active">Paga dal conto</button>
        <button data-s="USA_CUSCINETTO">Usa il cuscinetto</button>
      </span>
    </div>
  </div>

  <div id="banner"></div>
  <div class="kpis" id="kpis"></div>
  <svg id="chart" viewBox="0 0 1000 300" preserveAspectRatio="none"></svg>
  <table id="tab"><thead><tr><th>Giorno</th><th>Mese</th><th>Movimento</th><th>Importo</th><th>Saldo</th></tr></thead><tbody></tbody></table>

<script>
const eur = n => (n < 0 ? "-" : "") + "€" + Math.abs(n).toLocaleString("it-IT");
let cuscinetto = 0, scelta = "PAGA_DAL_CONTO";

const cusc = document.getElementById('cusc');
cusc.addEventListener('input', () => { cuscinetto = +cusc.value; document.getElementById('cuscVal').textContent = eur(cuscinetto); load(); });
document.querySelectorAll('.choice button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.choice button').forEach(x => x.classList.remove('active'));
  b.classList.add('active'); scelta = b.dataset.s; load();
}));

async function load() {
  const r = await fetch(`/api/simula/demo?cuscinetto=${cuscinetto}&scelta=${scelta}`);
  const d = await r.json();

  document.getElementById('apertura').textContent = d.messaggioApertura || '';

  const banner = document.getElementById('banner');
  if (d.salvatoDalCuscinetto) {
    banner.className = 'banner salva';
    banner.textContent = `🛡️ Il cuscinetto ti ha salvato dal rosso! Hai usato ${eur(d.cuscinettoUsato)} del cuscinetto invece di finire sotto zero.`;
  } else if (d.andatoInRosso) {
    banner.className = 'banner rosso';
    banner.textContent = `⚠️ Sei finito in rosso al giorno ${d.giornoRosso}. Saldo minimo: ${eur(d.saldoMinimo)}.`;
  } else {
    banner.className = 'banner ok';
    banner.textContent = `✅ Non sei mai finito in rosso. Saldo minimo: ${eur(d.saldoMinimo)}.`;
  }

  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="v">${eur(d.saldoFinale)}</div><div class="l">Saldo finale</div></div>
    <div class="kpi"><div class="v">${eur(d.saldoMinimo)}</div><div class="l">Saldo minimo</div></div>
    <div class="kpi"><div class="v">${eur(d.cuscinettoUsato)}</div><div class="l">Cuscinetto usato</div></div>
    <div class="kpi"><div class="v">${eur(d.cuscinettoFinale)}</div><div class="l">Cuscinetto rimasto</div></div>`;

  drawChart(d.movimenti);
  fillTable(d.movimenti);
}

function drawChart(mov) {
  const svg = document.getElementById('chart');
  const W = 1000, H = 300, pad = 30;
  const saldi = mov.map(m => m.saldoDopo);
  const max = Math.max(...saldi, 0), min = Math.min(...saldi, 0);
  const range = (max - min) || 1;
  const x = i => pad + (i * (W - 2 * pad)) / Math.max(mov.length - 1, 1);
  const y = v => pad + (max - v) * (H - 2 * pad) / range;

  let els = '';
  const yZero = y(0);
  els += `<line x1="${pad}" y1="${yZero}" x2="${W-pad}" y2="${yZero}" stroke="#ff4040" stroke-dasharray="4 4" stroke-width="1"/>`;
  els += `<text x="${pad}" y="${yZero-6}" fill="#ff6b6b" font-size="12">0</text>`;
  const pts = mov.map((m, i) => `${x(i)},${y(m.saldoDopo)}`).join(' ');
  els += `<polyline points="${pts}" fill="none" stroke="#A100FF" stroke-width="2.5"/>`;
  mov.forEach((m, i) => {
    const col = m.saldoDopo < 0 ? '#ff4040' : '#A100FF';
    els += `<circle cx="${x(i)}" cy="${y(m.saldoDopo)}" r="3.5" fill="${col}"><title>g${m.giorno} ${m.etichetta}: ${eur(m.saldoDopo)}</title></circle>`;
  });
  svg.innerHTML = els;
}

function fillTable(mov) {
  const tb = document.querySelector('#tab tbody');
  tb.innerHTML = mov.map(m => `
    <tr class="${m.saldoDopo < 0 ? 'rossoRow' : ''}">
      <td>${m.giorno}</td><td>${m.mese}</td><td>${m.etichetta}</td>
      <td class="${m.importo < 0 ? 'neg' : (m.importo>0?'pos':'')}">${m.importo===0?'—':eur(m.importo)}</td>
      <td>${eur(m.saldoDopo)}</td>
    </tr>`).join('');
}

document.getElementById('cuscVal').textContent = eur(0);
load().catch(e => document.getElementById('banner').textContent = 'Errore: ' + e.message);
</script>
</body>
</html>
