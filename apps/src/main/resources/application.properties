spring.application.name=hagenton
server.port=8080

# Percorso dell'eseguibile della CLI di Claude (usa la tua sottoscrizione).
claude.executable=C:\\Users\\e.francescangeli\\.local\\bin\\claude.exe
# Modello: "sonnet" (veloce) oppure "opus" (piu' bravo, consuma di piu').
claude.model=sonnet
claude.timeout-seconds=120

# Percorso del system prompt dell'agente (cartella ../agent).
agent.system-prompt-path=../agent/system-prompt.txt

# Provider AI: "claude-cli" (sottoscrizione locale) oppure "gemini" (API free, portabile).
llm.provider=claude-cli
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-3.5-flash-lite
